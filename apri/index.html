<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vorbit — Apri nell'app</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1e1b4b}
  .card{max-width:380px;margin:24px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(91,63,224,.15);text-align:center}
  .top{background:linear-gradient(135deg,#7c8cff,#5a3fe0);padding:28px 20px 22px;color:#fff}
  .top img{width:64px;height:64px;border-radius:18px}
  .top h1{margin:10px 0 0;font-size:24px}
  .body{padding:26px 26px 30px}
  .body h2{margin:0;font-size:20px}
  .body p{margin:10px 0 0;line-height:1.5;color:#4b4870}
  .code{margin:18px auto 0;display:flex;align-items:center;justify-content:center;gap:10px}
  .code span{font:700 20px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;background:#f4f2ff;padding:12px 16px;border-radius:14px}
  .code button{border:0;background:#ece9ff;color:#5a3fe0;font-weight:700;padding:12px 14px;border-radius:14px;cursor:pointer}
  a.btn{display:inline-block;margin-top:20px;background:#6d5af0;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:16px}
  .small{font-size:12px;color:#8a86a8}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><img src="../logo.png" alt=""><h1>Vorbit</h1></div>
    <div class="body">
      <h2 id="title">Apri Vorbit</h2>
      <p id="lead"></p>
      <div class="code" id="codeBox" hidden><span id="code"></span><button type="button" id="copy">Copia</button></div>
      <a class="btn" id="open" href="#">Apri in Vorbit</a>
      <p class="small" id="help"></p>
    </div>
  </div>
<script>
  // Links shared from the app (gifts, invites) point here because chat apps
  // only make https links tappable. This page hands them to the app:
  //   ?codice=XXX → vorbit://redeem/XXX   (gift / promo code)
  //   ?invito=XXX → vorbit://invite/XXX   (friend invite)
  var q = new URLSearchParams(location.search);
  var clean = function (s) { return (s || "").replace(/[^A-Za-z0-9-]/g, "").toUpperCase(); };
  var gift = clean(q.get("codice"));
  var invite = clean(q.get("invito"));
  var code = gift || invite;
  var path = gift ? "redeem/" + gift : invite ? "invite/" + invite : "";
  var en = (navigator.language || "").slice(0, 2) !== "it";
  var T = en
    ? { open: "Open in Vorbit", copy: "Copy", copied: "Copied!", giftT: "A gift for you 🎁", giftL: "Open Vorbit to redeem it.", giftH: "If the app doesn't open: Vorbit › Settings › Redeem a code, and paste the code.", invT: "Join me on Vorbit 🌱", invL: "Open Vorbit to accept the invite: you both get coins.", invH: "If the app doesn't open: Vorbit › Friends › Invite code, and paste the code.", noT: "Open Vorbit", noL: "This link opens the Vorbit app.", noApp: "Vorbit doesn't seem to be installed on this phone. Install it, then tap the link again or paste the code in the app." }
    : { open: "Apri in Vorbit", copy: "Copia", copied: "Copiato!", giftT: "Un regalo per te 🎁", giftL: "Apri Vorbit per riscattarlo.", giftH: "Se l'app non si apre: Vorbit › Impostazioni › Riscatta un codice, e incolla il codice.", invT: "Unisciti a me su Vorbit 🌱", invL: "Apri Vorbit per accettare l'invito: riceviamo monete a testa.", invH: "Se l'app non si apre: Vorbit › Amici › Codice invito, e incolla il codice.", noT: "Apri Vorbit", noL: "Questo link apre l'app Vorbit.", noApp: "Vorbit non sembra installata su questo telefono. Installala, poi tocca di nuovo il link oppure incolla il codice nell'app." };
  document.documentElement.lang = en ? "en" : "it";
  document.getElementById("title").textContent = gift ? T.giftT : invite ? T.invT : T.noT;
  document.getElementById("lead").textContent = gift ? T.giftL : invite ? T.invL : T.noL;
  document.getElementById("help").textContent = q.has("noapp") ? T.noApp : gift ? T.giftH : invite ? T.invH : "";
  var btn = document.getElementById("open");
  btn.textContent = T.open;
  if (code) {
    document.getElementById("codeBox").hidden = false;
    document.getElementById("code").textContent = code;
    var copy = document.getElementById("copy");
    copy.textContent = T.copy;
    copy.onclick = function () {
      navigator.clipboard && navigator.clipboard.writeText(code).then(function () { copy.textContent = T.copied; });
    };
  }
  var android = /Android/i.test(navigator.userAgent);
  var fallback = location.href.split("#")[0] + (location.search ? "&" : "?") + "noapp=1";
  // On Android an intent:// link opens the app, or comes back here when it
  // isn't installed; elsewhere the plain scheme is the best we can do.
  btn.href = android
    ? "intent://" + path + "#Intent;scheme=vorbit;package=com.moonvibes.vorbit;S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end"
    : "vorbit://" + path;
  if (android && !q.has("noapp")) location.href = btn.href;
</script>
</body>
</html>
